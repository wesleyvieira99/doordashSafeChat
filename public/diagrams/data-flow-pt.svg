<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" lang="pt">
<title id="title">Fluxo de dados e auditoria</title><desc id="desc">A decisão local produz um registro legível; persistência assíncrona é uma evolução proposta. Mensagem sintética. Validação e decisão. Resultado na interface. Avaliação offline. Auditoria minimizada. Outbox + fila. Em produção, a entrega não espera o consumidor de auditoria. Outbox durável e deduplicação exigem implementação.</desc>
<defs>
<marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d94135"/></marker>
<marker id="async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4174a6"/></marker>
<marker id="policy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7560a9"/></marker>
<marker id="human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b67d24"/></marker>
</defs>
