<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Core components</title><desc id="desc">The executable slice uses deterministic rules and versioned policies. 01 · Validate. 02 · Add context. 03 · Classify. 06 · Explain. 05 · Decide. 04 · Apply policy. Displayed scores and timings are illustrative scenarios. No real model inference runs in the browser.</desc>
<defs>
