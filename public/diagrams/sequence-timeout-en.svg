<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Sequence · timeout and fallback</title><desc id="desc">Scenario-injected failure; explicit conservative policy response. Interface. Engine. Policy. Local record. Unavailability is simulated, not a measured timeout. There is no unbounded retry in the critical path.</desc>
